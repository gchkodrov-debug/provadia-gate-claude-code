<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THE GATE OF PROVADIA</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Inter:wght@300;400&display=swap" rel="stylesheet">
    <style>
        body { margin: 0; background: #141210; overflow: hidden; font-family: 'Inter', sans-serif; color: #F4EFE6; }
        canvas { display: block; }

        #vignette { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; background: radial-gradient(circle, transparent 40%, rgba(0,0,0,0.8) 100%); }
        #fade-in { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; pointer-events: none; animation: fadeOut 2.6s forwards; z-index: 100; }
        @keyframes fadeOut { from { opacity: 1; } to { opacity: 0; } }

        .overlay { position: fixed; opacity: 0; transition: opacity 1.5s ease; pointer-events: none; }
        #ui-top { top: 5%; left: 50%; transform: translate(-50%, 0); text-align: center; }
        #ui-top h1 { font-family: 'Cinzel', serif; color: #FFEFC1; font-size: 2.5rem; letter-spacing: 0.3rem; margin: 0; }
        #ui-top p { font-family: 'Cinzel', serif; font-size: 0.8rem; letter-spacing: 0.1rem; color: #C9A227; margin-top: 0.5rem; }

        #ui-bottom-left { bottom: 8%; left: 5%; text-align: left; }
        #ui-bottom-left .title { font-family: 'Cinzel', serif; color: #FFEFC1; font-size: 1.2rem; margin-bottom: 0.2rem; }
        #ui-bottom-left .stat { font-size: 0.9rem; opacity: 0.8; }

        #ui-bottom-right { bottom: 8%; right: 5%; text-align: right; font-size: 0.8rem; opacity: 0.6; }

        #ui-center { bottom: 5%; left: 50%; transform: translate(-50%, 0); pointer-events: auto; }
        #flip-btn { background: transparent; border: 1px solid #C9A227; color: #FFEFC1; font-family: 'Cinzel', serif; padding: 0.6rem 1.5rem; cursor: pointer; transition: all 0.3s; border-radius: 50px; font-size: 0.9rem; }
        #flip-btn:hover { background: rgba(201, 162, 39, 0.2); }
    </style>
</head>
<body>
    <div id="fade-in"></div>
    <div id="vignette"></div>

    <div id="ui-top" class="overlay">
        <h1>PROVADIA</h1>
        <p>THE GATE · EUROPE'S FIRST TOWN OF RECORD</p>
    </div>

    <div id="ui-bottom-left" class="overlay">
        <div class="title">THE GOLDEN WALL</div>
        <div class="stat">0 / 47 bricks laid · one is waiting</div>
    </div>

    <div id="ui-bottom-right" class="overlay">TAP THE COIN</div>

    <div id="ui-center" class="overlay">
        <button id="flip-btn">FLIP THE COIN</button>
    </div>

    <script type="module">
        import * as THREE from './three.module.min.js';

        // --- Constants & Specs ---
        const PALETTE = { field: 0x141210, gold1: 0xC9A227, gold2: 0xFFEFC1, gold3: 0x6B4A12, gold4: 0x3D2A08, white: 0xF4EFE6 };
        const FLIGHT_DURATION = 10.5;
        const COIN_POS = new THREE.Vector3(0, 2.35, 0);

        // --- Initialization ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(PALETTE.field);
        scene.fog = new THREE.FogExp2(PALETTE.field, 0.028);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 100);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.shadowMap.enabled = true;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        document.body.appendChild(renderer.domElement);

        // --- Lighting ---
        const keyLight = new THREE.DirectionalLight(0xFFF4E6, 1.2);
        keyLight.position.set(-5, 10, 5);
        keyLight.castShadow = true;
        keyLight.shadow.mapSize.width = 2048;
        keyLight.shadow.mapSize.height = 2048;
        scene.add(keyLight);

        const hemiLight = new THREE.HemisphereLight(0xFFFFFF, PALETTE.field, 0.2);
        scene.add(hemiLight);

        const emberGlow = new THREE.PointLight(PALETTE.gold1, 0.8, 8);
        emberGlow.position.set(0, 2, 2);
        scene.add(emberGlow);

        // --- Ground ---
        const groundGeo = new THREE.CircleGeometry(50, 64);
        const groundMat = new THREE.MeshStandardMaterial({ color: PALETTE.field, roughness: 0.8 });
        const ground = new THREE.Mesh(groundGeo, groundMat);
        ground.rotation.x = -Math.PI / 2;
        ground.position.y = -0.62;
        ground.receiveShadow = true;
        scene.add(ground);

        // --- The Gate ---
        const gateGroup = new THREE.Group();
        const stoneMat = new THREE.MeshStandardMaterial({ color: 0x222222 });
        const goldTrimMat = new THREE.MeshStandardMaterial({ color: PALETTE.gold1, metalness: 0.8, roughness: 0.2 });

        const pillarGeo = new THREE.BoxGeometry(1.5, 8.6, 1.5);
        const pLeft = new THREE.Mesh(pillarGeo, stoneMat);
        pLeft.position.set(-4.1, 3.7, 7);
        pLeft.castShadow = true;
        gateGroup.add(pLeft);

        const pRight = new THREE.Mesh(pillarGeo, stoneMat);
        pRight.position.set(4.1, 3.7, 7);
        pRight.castShadow = true;
        gateGroup.add(pRight);

        const lintelGeo = new THREE.BoxGeometry(9.5, 1.2, 1.5);
        const lintel = new THREE.Mesh(lintelGeo, stoneMat);
        lintel.position.set(0, 8, 7);
        lintel.castShadow = true;
        gateGroup.add(lintel);

        // Simple Gold Trims
        const trimGeo = new THREE.BoxGeometry(1.6, 0.1, 1.6);
        const tL = new THREE.Mesh(trimGeo, goldTrimMat); tL.position.set(-4.1, 8, 7); gateGroup.add(tL);
        const tR = new THREE.Mesh(trimGeo, goldTrimMat); tR.position.set(4.1, 8, 7); gateGroup.add(tR);
        const tLine = new THREE.Mesh(new THREE.BoxGeometry(9.5, 0.1, 1.6), goldTrimMat); tLine.position.set(0, 8.6, 7); gateGroup.add(tLine);

        scene.add(gateGroup);

        // --- The Coin ---
        const coinGroup = new THREE.Group();
        coinGroup.position.copy(COIN_POS);
        scene.add(coinGroup);

        const coinGeo = new THREE.CylinderGeometry(2, 2, 0.36, 64);
        const coinMat = new THREE.MeshStandardMaterial({ color: PALETTE.gold1, metalness: 0.9, roughness: 0.1 });
        const coinBody = new THREE.Mesh(coinGeo, coinMat);
        coinBody.rotation.x = Math.PI / 2;
        coinBody.castShadow = true;
        coinGroup.add(coinBody);

        // FRONT FACE
        const frontGroup = new THREE.Group();
        frontGroup.position.z = 0.181;
        coinGroup.add(frontGroup);

        // 5 stacked brick courses
        for (let i = 0; i < 5; i++) {
            const row = new THREE.Group();
            for (let j = 0; j < 6; j++) {
                const b = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.15, 0.1), coinMat);
                b.position.set(-1.2 + j * 0.4, -0.4 + i * 0.2, 0);
                row.add(b);
            }
            frontGroup.add(row);
        }
        // 7 merlons
        for (let i = 0; i < 7; i++) {
            const m = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.2, 0.1), coinMat);
            const angle = (Math.PI / 6) * i + Math.PI/2;
            m.position.set(Math.cos(angle) * 1.8, Math.sin(angle) * 1.8, 0);
            m.rotation.z = angle + Math.PI/2;
            frontGroup.add(m);
        }
        // 47 beads rim
        for (let i = 0; i < 47; i++) {
            const s = new THREE.Mesh(new THREE.SphereGeometry(0.05, 8, 8), coinMat);
            const angle = (Math.PI * 2 / 47) * i;
            s.position.set(Math.cos(angle) * 1.76, Math.sin(angle) * 1.76, 0);
            frontGroup.add(s);
        }

        // BACK FACE
        const backGroup = new THREE.Group();
        backGroup.position.z = -0.181;
        backGroup.rotation.y = Math.PI;
        coinGroup.add(backGroup);

        const sunDisc = new THREE.Mesh(new THREE.CircleGeometry(1.2, 32), new THREE.MeshStandardMaterial({ color: PALETTE.gold2, emissive: PALETTE.gold3, emissiveIntensity: 0.5 }));
        backGroup.add(sunDisc);

        for (let i = 0; i < 3; i++) {
            const ring = new THREE.Mesh(new THREE.TorusGeometry(0.4 + i * 0.4, 0.03, 16, 64), coinMat);
            ring.position.z = -0.01;
            backGroup.add(ring);
        }
        for (let i = 0; i < 47; i++) {
            const b = new THREE.Mesh(new THREE.SphereGeometry(0.04, 8, 8), coinMat);
            const angle = (Math.PI * 2 / 47) * i;
            b.position.set(Math.cos(angle) * 1.76, Math.sin(angle) * 1.76, 0);
            backGroup.add(b);
        }

        // --- Golden Wall ---
        const wallGroup = new THREE.Group();
        wallGroup.position.set(0, 2.35, -8.5);
        scene.add(wallGroup);

        const wallCanvas = document.createElement('canvas');
        wallCanvas.width = 2048; wallCanvas.height = 768;
        const ctx = wallCanvas.getContext('2d');
        ctx.fillStyle = '#141210'; ctx.fillRect(0, 0, 2048, 768);
        ctx.strokeStyle = '#6B4A12'; ctx.lineWidth = 2;

        let slotIdx = 0;
        const rowCounts = [12, 12, 12, 11];
        for (let r = 0; r < 4; r++) {
            for (let c = 0; c < rowCounts[r]; c++) {
                ctx.strokeRect(100 + c * 150, 150 + r * 140, 100, 60);
                slotIdx++;
            }
        }
        const wallTex = new THREE.CanvasTexture(wallCanvas);
        const wallPlane = new THREE.Mesh(new THREE.PlaneGeometry(27, 10.1), new THREE.MeshStandardMaterial({ map: wallTex, transparent: true }));
        wallGroup.add(wallPlane);

        // Waiting Brick
        const waitGeo = new THREE.PlaneGeometry(3.5, 2.1); // scaled to slot
        const waitMat = new THREE.MeshBasicMaterial({ color: PALETTE.gold2, transparent: true, opacity: 0.5, side: THREE.DoubleSide });
        const waitBrick = new THREE.Mesh(waitGeo, waitMat);
        waitBrick.position.set(-12, 3.5, 0.01); // approx first slot
        wallGroup.add(waitBrick);
        const waitEdges = new THREE.EdgesGeometry(waitGeo);
        const waitLine = new THREE.LineSegments(waitEdges, new THREE.LineBasicMaterial({ color: PALETTE.gold2 }));
        waitLine.position.copy(waitBrick.position);
        wallGroup.add(waitLine);

        // --- Salt Dust ---
        const dustGeo = new THREE.BufferGeometry();
        const dustPos = new Float32Array(380 * 3);
        for (let i = 0; i < 380 * 3; i++) dustPos[i] = (Math.random() - 0.5) * 40;
        dustGeo.setAttribute('position', new THREE.BufferAttribute(dustPos, 3));

        const dustCanvas = document.createElement('canvas');
        dustCanvas.width = 32; dustCanvas.height = 32;
        const dctx = dustCanvas.getContext('2d');
        const grad = dctx.createRadialGradient(16, 16, 0, 16, 16, 16);
        grad.addColorStop(0, 'rgba(244, 239, 230, 0.8)');
        grad.addColorStop(1, 'rgba(244, 239, 230, 0)');
        dctx.fillStyle = grad; dctx.fillRect(0, 0, 32, 32);
        const dustTex = new THREE.CanvasTexture(dustCanvas);

        const dustMat = new THREE.PointsMaterial({ size: 0.15, map: dustTex, transparent: true, blending: THREE.AdditiveBlending, color: PALETTE.white });
        const dust = new THREE.Points(dustGeo, dustMat);
        scene.add(dust);

        // --- Flight Path ---
        const curve = new THREE.CatmullRomCurve3([
            new THREE.Vector3(0, 2.35, 31),
            new THREE.Vector3(0, 2.35, 15),
            new THREE.Vector3(0, 2.35, 7),
            new THREE.Vector3(0, 2.35, 6.4)
        ]);

        const urlParams = new URLSearchParams(window.location.search);
        let shot = urlParams.has('shot') ? parseFloat(urlParams.get('shot')) : null;
        let flightProgress = 0;

        // --- Interaction ---
        let isFlipping = false;
        let flipRotation = 0;
        const flipCoin = () => {
            if (isFlipping) return;
            isFlipping = true;
            const startRot = coinGroup.rotation.y;
            const targetRot = startRot + Math.PI;
            let start = null;
            const duration = 1500;

            const animateFlip = (now) => {
                if (!start) start = now;
                const elapsed = now - start;
                const t = Math.min(elapsed / duration, 1);
                const eased = t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
                coinGroup.rotation.y = startRot + (targetRot - startRot) * eased;
                if (t < 1) requestAnimationFrame(animateFlip);
                else { isFlipping = false; flipRotation = targetRot; }
            };
            requestAnimationFrame(animateFlip);
        };
        document.getElementById('flip-btn').addEventListener('click', flipCoin);
        renderer.domElement.addEventListener('click', flipCoin);

        // --- Main Loop ---
        const clock = new THREE.Clock();
        function animate() {
            requestAnimationFrame(animate);
            const time = clock.getElapsedTime();

            // Flight
            if (shot === null) {
                flightProgress = Math.min(time / FLIGHT_DURATION, 1);
            } else {
                flightProgress = shot;
            }

            const t = flightProgress;
            const easedT = t * t * (3 - 2 * t); // smootherstep approx
            const pos = curve.getPointAt(easedT);
            camera.position.copy(pos);
            camera.lookAt(COIN_POS);

            if (t >= 1) {
                camera.position.x += Math.sin(time * 0.5) * 0.05;
                camera.position.y += Math.cos(time * 0.3) * 0.05;
                camera.lookAt(COIN_POS);
            }

            // Overlays
            if (t > 0.86) {
                document.querySelectorAll('.overlay').forEach(el => el.style.opacity = '1');
            }

            // Coin Idle
            if (!isFlipping) {
                coinGroup.position.y = COIN_POS.y + Math.sin(time) * 0.05;
                coinGroup.rotation.y += 0.005;
            }

            // Wall Pulse
            waitBrick.material.opacity = 0.3 + Math.sin(time * 2) * 0.2;
            waitLine.material.opacity = 0.5 + Math.sin(time * 2) * 0.3;

            // Dust
            dust.position.y += 0.002;
            if (dust.position.y > 5) dust.position.y = -5;

            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
